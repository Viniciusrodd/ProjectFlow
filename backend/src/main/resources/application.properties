
spring.application.name=ProjectFlowApplication

# load .env when running outside docker
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# mysql config
spring.datasource.url=jdbc:mysql://localhost:3306/projectFlow?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mongodb config
spring.mongodb.uri=mongodb://localhost:27017/projectFlow
spring.mongodb.representation.uuid=standard

# jpa config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view= true

# JWT confg
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# "86400000" = 24 hours in milliseconds

# request/file size config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB